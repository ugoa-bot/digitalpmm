<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Article | Ugochinyere Amaonyeanaso</title><style>body{font-family:Poppins,Arial,sans-serif;margin:0;color:#171217}.wrap{width:min(850px,92%);margin:90px auto}.k{color:#b2227a;font-weight:800;text-transform:uppercase}h1{font-size:clamp(38px,6vw,62px);line-height:1.05;color:#4a1354}p{line-height:1.8;color:#665f66}.heroimg{width:100%;max-height:500px;object-fit:cover;border-radius:18px}a{color:#b2227a;font-weight:700}

</style></head><body><main class="wrap"><a href="blog.html">← Back to Blog</a><div id="post"><p>Loading article...</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const c=window.SUPABASE_CONFIG||{};const id=new URLSearchParams(location.search).get('id');if(!c.url||!c.anonKey||c.url.includes('YOUR_')){document.getElementById('post').innerHTML='<p>Connect Supabase to display published articles.</p>';return}const db=supabase.createClient(c.url,c.anonKey);const {data,error}=await db.from('posts').select('*').eq('id',id).eq('published',true).single();if(error){document.getElementById('post').innerHTML='<p>Article not found.</p>';return}document.title=data.title+' | Ugochinyere Amaonyeanaso';document.getElementById('post').innerHTML='<div class="k">SEO & Digital Project Management</div><h1>'+esc(data.title)+'</h1>'+(data.image_url?'<img class="heroimg" src="'+esc(data.image_url)+'" alt="'+esc(data.title)+'">':'')+'<p>'+esc(data.excerpt||'')+'</p><div>'+format(data.content)+'</div>';function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function format(v){return esc(v).split(/\n\s*\n/).map(x=>'<p>'+x.replace(/\n/g,'<br>')+'</p>').join('')}</script></body></html>
