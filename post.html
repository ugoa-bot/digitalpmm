<style>
:root{--pink:#b2227a;--cream:#fdf4e2;--purple:#4a1354;--ink:#171217;--muted:#665f66;--line:#eadfe7;--soft:#fff8fb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Poppins,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.65}
a{text-decoration:none}
header{position:sticky;top:0;left:0;right:0;z-index:50;background:#000;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}

.navlinks{display:flex;gap:23px;align-items:center;color:#fff;font-size:13px;font-weight:600}
.navlinks a{color:#fff}
.navlinks a:hover{color:#f2b8d8}
.menu{display:none;background:none;border:0;color:#fff;font-size:27px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:9px;font-weight:700;border:1px solid transparent}
.btn-primary{background:var(--pink);color:#fff!important}
.wrap{width:min(850px,92%);margin:65px auto 90px}
.back{color:var(--pink);font-weight:800}
.k{color:var(--pink);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:28px}
h1{font-size:clamp(38px,6vw,62px);line-height:1.05;color:var(--purple);margin:12px 0 20px}

.heroimg{width:100%;max-height:500px;object-fit:cover;border-radius:18px;margin:10px 0 28px}
.article-content{font-size:18px;line-height:1.8;color:#332d34;margin-top:28px}
.article-content h2{font-size:clamp(28px,4vw,36px);line-height:1.2;color:var(--purple);margin:42px 0 14px}
.article-content h3{font-size:24px;color:var(--purple);margin:30px 0 10px}
.article-content p{margin:0 0 20px}
.article-content ul,.article-content ol{padding-left:28px;margin:0 0 22px}
.article-content li{margin-bottom:8px}
.article-content a{color:var(--pink);font-weight:700}
.article-content strong{color:var(--ink)}
.article-content img{max-width:100%;height:auto;border-radius:12px}
@media(max-width:850px){
 .nav{min-height:70px}
 .logo{font-size:14px;max-width:230px;line-height:1.25}
 .menu{display:block}
 .navlinks{display:none;position:absolute;top:70px;left:0;right:0;background:#000;padding:18px 5%;flex-direction:column;align-items:stretch;gap:4px;border-top:1px solid #222;box-shadow:0 12px 30px rgba(0,0,0,.25)}
 .navlinks.open{display:flex}

 h1{font-size:40px}

}

<body>
<header>
  <div class="container nav">
    <a class="logo" href="index.html">Digital Project Management Services</a>
    <nav class="navlinks" id="siteNav">
      <a href="index.html">Home</a><a href="/services">Services</a><a href="/projects">Projects</a><a href="/about">About</a><a href="/blog">Blog</a><a href="/contact">Contact</a>
      <a class="btn btn-primary" href="https://calendly.com/ugochinyere" target="_blank" rel="noopener">Book a Consultation</a>
    </nav>
    <button class="menu" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>

<main class="wrap">
  <a class="back" href="/blog">← Back to Blog</a>
  <div id="post"><p>Loading article...</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="supabase-config.js"></script>
<script>
const menuBtn=document.getElementById('menuBtn');
const siteNav=document.getElementById('siteNav');
if(menuBtn) menuBtn.addEventListener('click',()=>{const open=siteNav.classList.toggle('open');menuBtn.setAttribute('aria-expanded',open?'true':'false');menuBtn.textContent=open?'×':'☰';});
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function markdownToHtml(value){
  let s=String(value??'').trim();
  if(!s)return '';
  if(/<\/?(h2|h3|p|ul|ol|li|strong|em|a|br)\b/i.test(s)) return s;
  s=s.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
     .replace(/^##\s+(.+)$/gm,'<h2>$1</h2>')
     .replace(/^#\s+(.+)$/gm,'<h2>$1</h2>');
  const lines=s.split(/\r?\n/);
  let out='',inList=false;
  for(const raw of lines){
    const line=raw.trim();
    if(!line){if(inList){out+='</ul>';inList=false;}continue;}
    if(/^[-*]\s+/.test(line)){if(!inList){out+='<ul>';inList=true;}out+='<li>'+line.replace(/^[-*]\s+/,'')+'</li>';continue;}
    if(/^\d+[.)]\s+/.test(line)){if(inList){out+='</ul>';inList=false;}out+='<p>'+line+'</p>';continue;}
    if(/^<h[23]>/.test(line)){if(inList){out+='</ul>';inList=false;}out+=line;continue;}
    if(inList){out+='</ul>';inList=false;}
    out+='<p>'+line+'</p>';
  }
  if(inList)out+='</ul>';
  return out.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
}
(async()=>{
  const target=document.getElementById('post');
  const c=window.SUPABASE_CONFIG||{};
  const id=new URLSearchParams(location.search).get('id');
  if(!id){target.innerHTML='<p>Article not found.</p>';return;}
  if(!c.url||!c.anonKey||c.url.includes('YOUR_')){target.innerHTML='<p>Connect Supabase to display published articles.</p>';return;}
  try{
    const db=supabase.createClient(c.url,c.anonKey);
    const now=new Date().toISOString();const {data,error}=await db.from('posts').select('*').eq('id',id).eq('published',true).or(`scheduled_at.is.null,scheduled_at.lte.${now}`).single();
    if(error||!data){target.innerHTML='<p>Article not found.</p>';return;}
    document.title=data.title+' | Ugochinyere Amaonyeanaso';
    const validImage=typeof data.image_url==='string' && /^https?:\/\//i.test(data.image_url.trim());
    const image=validImage?'<img class="heroimg" src="'+esc(data.image_url.trim())+'" alt="'+esc(data.title)+'">':'';
    const content=DOMPurify.sanitize(markdownToHtml(data.content||''));
    target.innerHTML='<div class="k">SEO & Digital Project Management</div><h1>'+esc(data.title)+'</h1>'+image+'<p class="excerpt">'+esc(data.excerpt||'')+'</p><article class="article-content">'+content+'</article>';
  }catch(e){console.error(e);target.innerHTML='<p>We could not load this article right now. Please refresh and try again.</p>';}
})();
</script>
