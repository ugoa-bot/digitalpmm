<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Digital Project Management and SEO insights.">
<link rel="stylesheet" href="shared.css">
<title>Post | Ugochinyere Amaonyeanaso</title>
<style>
  .post-hero{padding:70px 0 30px;background:var(--paper);}
  .post-hero .cat{color:var(--violet);font-weight:800;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;display:block;}
  .post-hero h1{font-size:clamp(28px,4.6vw,42px);max-width:760px;}
  .post-hero .date{color:var(--muted);font-size:13.5px;margin-top:14px;}
  .post-image{width:100%;max-height:440px;object-fit:cover;border-radius:18px;margin:32px 0;display:none;}
  .post-body{max-width:760px;margin:0 auto;padding-bottom:80px;font-size:16.5px;line-height:1.8;color:var(--ink);}
  .post-body p{margin-bottom:20px;white-space:pre-wrap;}
  .post-nav{max-width:760px;margin:0 auto;padding-top:20px;border-top:1px solid var(--line);}
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:78px;">
    <a href="index.html" class="brand"><span class="dot"></span>Digital Project Management</a>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
      <a href="blog.html" class="current">Blog</a>
      <a href="contact.html">Contact</a>
      <a class="btn btn-primary" href="https://calendly.com/ugochinyere" target="_blank" rel="noopener">Book a Consultation</a>
    </div>
    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
</nav>

<header class="post-hero wrap">
  <span class="cat" id="postCat" style="display:none;"></span>
  <h1 id="postTitle">Loading…</h1>
  <div class="date" id="postDate"></div>
</header>

<div class="wrap">
  <img id="postImage" class="post-image" alt="">
  <div class="post-body" id="postBody"></div>
  <div class="post-nav">
    <a href="blog.html" class="btn btn-outline">← Back to Blog</a>
  </div>
</div>

<footer style="margin-top:60px;">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© 2026 Ugochinyere Amaonyeanaso. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  function esc(v){
    return String(v ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  }

  (async () => {
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const slug = params.get("slug");
    const cfg = window.SUPABASE_CONFIG || {};

    if((!id && !slug) || !cfg.url){
      document.getElementById("postTitle").textContent = "Post not found";
      return;
    }

    const db = supabase.createClient(cfg.url, cfg.anonKey);
    let query = db.from("posts").select("*").eq("published", true);
    query = id ? query.eq("id", id) : query.eq("slug", slug);

    const { data, error } = await query.single();

    if(error || !data){
      document.getElementById("postTitle").textContent = "Post not found";
      document.getElementById("postBody").innerHTML = "<p>This post may have been removed or is no longer available.</p>";
      return;
    }

    document.title = data.title + " | Ugochinyere Amaonyeanaso";
    const descMeta = document.querySelector('meta[name="description"]');
    if(descMeta) descMeta.setAttribute("content", data.excerpt || data.title);

    document.getElementById("postTitle").textContent = data.title;
    document.getElementById("postDate").textContent = new Date(data.created_at).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});

    if(data.category){
      const catEl = document.getElementById("postCat");
      catEl.textContent = data.category;
      catEl.style.display = "block";
    }

    if(data.image_url){
      const img = document.getElementById("postImage");
      img.src = data.image_url;
      img.alt = data.title;
      img.style.display = "block";
    }

    const paragraphs = String(data.content || "").split(/\n\s*\n/);
    document.getElementById("postBody").innerHTML = paragraphs.map(p => `<p>${esc(p)}</p>`).join("");
  })();
</script>
<script src="nav.js"></script>
</body>
</html>
